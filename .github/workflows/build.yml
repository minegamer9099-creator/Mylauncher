name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # Actions tab se manually "Run workflow" bhi chal sakta hai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest mein Android SDK pehle se installed hota hai (ANDROID_HOME).
      # Isliye android-actions/setup-android ki zaroorat nahi, aur obsolete 'tools' package ka error bhi nahi aata.
      - name: Accept Android SDK licenses and install required packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          # 'yes' pipe band hone pe SIGPIPE deta hai; pipefail band karke licenses accept karo
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # gradlew wrapper nahi hai, isliye Gradle 8.7 yahin install hota hai (AGP 8.5.2 ke liye)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
